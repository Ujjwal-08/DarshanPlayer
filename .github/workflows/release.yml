name: Build release

# Builds the installer, portable zip and update packages the same way
# build-release.ps1 does locally — but on a clean machine, which is what code
# signing services require before they will sign anything ("trusted build system").
#
# Push a tag (v1.3.0) to build and publish a draft GitHub release.
# Run manually from the Actions tab to build artifacts without releasing.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.3.0)'
        required: true
        type: string

permissions:
  contents: write          # needed to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          # A tag build takes the version from the tag; a manual run takes the input.
          $v = if ('${{ github.ref_type }}' -eq 'tag') {
                 '${{ github.ref_name }}' -replace '^v', ''
               } else {
                 '${{ inputs.version }}'
               }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not X.Y.Z" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building $v"

      - name: Check the version matches the project
        shell: pwsh
        run: |
          # Catches the easy mistake of tagging without bumping DarshanPlayer.csproj.
          $csproj = [xml](Get-Content DarshanPlayer.csproj)
          $projectVersion = $csproj.Project.PropertyGroup.Version | Where-Object { $_ }
          if ($projectVersion -ne '${{ steps.version.outputs.version }}') {
            throw "Tag says ${{ steps.version.outputs.version }} but DarshanPlayer.csproj says $projectVersion"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk --version 1.2.0

      # vlc-cache-gen is a ~40MB download used to pregenerate plugins.dat, which is
      # what keeps startup fast. Cached so most builds skip the download.
      - name: Cache VLC cache-gen tool
        uses: actions/cache@v4
        with:
          path: .vlctool
          key: vlctool-3.0.23

      - name: Run tests
        shell: pwsh
        run: dotnet test DarshanPlayer.Tests/DarshanPlayer.Tests.csproj --configuration Release

      # ── Signing ────────────────────────────────────────────────────────────
      # Until a certificate is in place this builds unsigned, which still produces
      # working artifacts. To enable signing, set ONE of these and pass it below:
      #
      #   SignPath (free for open source):
      #     add the SignPath GitHub Action before this step and use
      #     -SignTemplate '<their CLI> sign {{file}}'
      #
      #   A certificate you hold (e.g. Certum):
      #     store the .pfx as a base64 secret, write it to disk here, then use
      #     -SignParams '/fd sha256 /f cert.pfx /p $env:CERT_PASSWORD /tr http://time.certum.pl /td sha256'
      #
      # vpk applies the signature to every PE file plus Setup.exe, which is what the
      # Microsoft Store requires for an EXE submission.
      - name: Build release artifacts
        shell: pwsh
        run: ./build-release.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Check what was produced
        shell: pwsh
        run: |
          $expected = @(
            "DarshanPlayer-win-Setup.exe"
            "DarshanPlayer-win-Portable.zip"
            "DarshanPlayer-${{ steps.version.outputs.version }}-full.nupkg"
            "releases.win.json"
          )
          foreach ($f in $expected) {
            $path = Join-Path 'Releases' $f
            if (-not (Test-Path $path)) { throw "Missing expected artifact: $f" }
            $mb = [math]::Round((Get-Item $path).Length / 1MB, 1)
            $sig = (Get-AuthenticodeSignature $path).Status
            Write-Host ("{0,-42} {1,8} MB  signature: {2}" -f $f, $mb, $sig)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: darshan-player-${{ steps.version.outputs.version }}
          path: Releases/
          retention-days: 14

      # Draft, not published: gives a chance to check the artifacts and write the
      # release notes before existing installs start auto-updating to it.
      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} `
            (Get-ChildItem Releases -File | Where-Object { $_.Name -ne 'RELEASES' } | ForEach-Object { $_.FullName }) `
            --repo ${{ github.repository }} `
            --title "Darshan Player ${{ steps.version.outputs.version }}" `
            --draft `
            --generate-notes
